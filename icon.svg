<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="#090d16"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <!-- Circuit Nodes & Lines -->
  <circle cx="160" cy="256" r="32" fill="#fbbf24"/>
  <circle cx="352" cy="180" r="24" fill="#34d399"/>
  <circle cx="352" cy="332" r="24" fill="#60a5fa"/>
  <!-- Orthogonal Wires -->
  <path d="M 192 256 H 256 V 180 H 328" stroke="#10b981" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 192 256 H 256 V 332 H 328" stroke="#3b82f6" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center 9R Typography -->
  <text x="160" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#090d16" text-anchor="middle">9R</text>
</svg>